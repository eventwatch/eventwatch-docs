version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'starlight-*'
    ignore:
      # @astrojs/check の peer が typescript 6 までなので、対応するまで major を上げない
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
